[project]
name = "rtxlink-sim"
version = "0.1.0"
description = "Radio simulator implementing the OpenRTX serial control and data protocol (draft 2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rtxlink-sim = "rtxlink_sim.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rtxlink_sim"]
